services:
  db:
    image: postgres:16
    container_name: doomsday-db
    environment:
      POSTGRES_USER: doomsday
      POSTGRES_PASSWORD: doomsday_pass
      POSTGRES_DB: doomsday_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doomsday -d doomsday_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://doomsday:doomsday_pass@db:5432/doomsday_db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: